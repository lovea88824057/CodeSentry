[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentry"
version = "0.1.0"
description = "CodeSentry - 本地优先的 AI 代码审查 Agent（结构化 Review 报告）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["AI", "Code Review", "LLM", "Diff", "Agent"]

dependencies = [
  # 多 Provider 统一入口：一套 API 覆盖 OpenAI / DeepSeek / 通义 / Anthropic / Ollama 等
  "litellm>=1.100",
  # token 计数（决定"整发 / 分块 / 裁剪"的核心依据）
  "tiktoken>=0.12",
  # prompt 模板渲染（system/user 双段 + 条件分支）
  "jinja2>=3.1",
  # 数据模型与 YAML 结果校验
  "pydantic>=2.9",
  "pyyaml>=6.0",
  # 本地仓库读取（git diff / git show 取文件全文）
  "gitpython>=3.1",
  # 终端彩色输出
  "rich>=13.0",
  # .env 加载
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codesentry = "codesentry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codesentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--color=yes"

[tool.ruff]
line-length = 120
